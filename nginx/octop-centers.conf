# Include map in the http {} context; use the server block below in the same context.
# Replace all private IPs and certificate paths with actual infrastructure values.
# External ports 8091-8100 must be forwarded/firewalled to this Nginx server.
map $server_port $octop_backend {
    default "";
    8091 10.20.1.21:8088;
    8092 10.20.1.22:8088;
    8093 10.20.1.23:8088;
    8094 10.20.1.24:8088;
    8095 10.20.1.25:8088;
    8096 10.20.1.26:8088;
    8097 10.20.1.27:8088;
    8098 10.20.1.28:8088;
    8099 10.20.1.29:8088;
    8100 10.20.1.30:8088;
}

map $http_upgrade $octop_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8091 ssl;
    listen 8092 ssl;
    listen 8093 ssl;
    listen 8094 ssl;
    listen 8095 ssl;
    listen 8096 ssl;
    listen 8097 ssl;
    listen 8098 ssl;
    listen 8099 ssl;
    listen 8100 ssl;
    server_name ai.superice.com;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    client_max_body_size 100m;

    if ($octop_backend = "") { return 404; }

    location / {
        proxy_pass http://$octop_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $octop_connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
